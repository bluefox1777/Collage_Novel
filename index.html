const ok=async p=>{const r=await p;if(r.error)throw r.error;return r};
const put=async(t,row,isNew)=>{if(isNew)await ok(sb.from(t).insert(row));else await ok(sb.from(t).update(row).eq('id',row.id))};

async function doSync(){
 if(!ME||!snap)return;const S=snap;
 // 1) 음원
 const mt=db.tracks.filter(t=>t.owner===ME);
 for(const t of mt){if(S.t[t.id]!==undefined)continue;let p;
  if(t.src.startsWith('data:')){const b=await d2b(t.src);p=UID+'/'+t.id+'.'+(EXT[b.type]||'mp3');await ok(sb.storage.from('audio').upload(p,b,{contentType:b.type||'audio/mpeg'}));t.src=PUB+'audio/'+p;await ok(sb.from('tracks').insert({id:t.id,owner:UID,name:t.name,path:p,size_bytes:b.size}))}
  else p=pthA(t.src);
  t.path=p;S.t[t.id]=p}
 // 2) 캐릭터
 const mc=db.chars.filter(c=>c.owner===ME);
 for(const c of mc){if(c.img&&c.img.startsWith('data:'))c.img=await upImg(c.img);const r=rowC(c),j=J(r);if(S.c[c.id]!==j){await put('characters',r,S.c[c.id]===undefined);S.c[c.id]=j}}
 // 3) 시리즈와 회차
 const ms=mineS(),ws=wrS();
 for(const s of ws){
  if(s.author===ME){
   if(s.cover&&s.cover.startsWith('data:'))s.cover=await upImg(s.cover);
   if(s.banner&&s.banner.startsWith('data:'))s.banner=await upImg(s.banner);
   const r=rowS(s),j=J(r);if(S.s[s.id]!==j){await put('series',r,S.s[s.id]===undefined);S.s[s.id]=j}}
  for(let i=0;i<s.eps.length;i++){const e=s.eps[i];
   if(e.img&&e.img.startsWith('data:'))e.img=await upImg(e.img);
   if(e.html&&e.html.includes('src="data:image'))e.html=await upHtml(e.html);
   const x=rowE(e,i,s.id),ej=J(x);
   if(S.e[e.id]!==ej){x.updated_at=new Date().toISOString();await put('episodes',x,S.e[e.id]===undefined);S.e[e.id]=ej}}}
 const sids=new Set(ms.map(s=>s.id)),eids=new Set();ws.forEach(s=>s.eps.forEach(e=>eids.add(e.id)));
 for(const id of Object.keys(S.e))if(!eids.has(id)){await ok(sb.from('episodes').delete().eq('id',id));delete S.e[id]}
 for(const id of Object.keys(S.s))if(!sids.has(id)){await ok(sb.from('series').delete().eq('id',id));delete S.s[id]}
 for(const id of Object.keys(S.c))if(!mc.find(c=>c.id===id)){await ok(sb.from('characters').delete().eq('id',id));delete S.c[id]}
 for(const id of Object.keys(S.t))if(!mt.find(t=>t.id===id)){await ok(sb.from('tracks').delete().eq('id',id));await sb.storage.from('audio').remove([S.t[id]]);delete S.t[id]}
 // 4) 댓글
 const cur={};db.series.forEach(s=>s.eps.forEach(e=>(e.cm||[]).forEach(m=>{if(m.mine)cur[m.id]=[e,m]})));
 for(const id of Object.keys(cur)){if(S.m[id])continue;const [e,m]=cur[id];let im=m.img;if(im&&im.startsWith('data:'))im=await upImg(im);
  await ok(sb.from('comments').insert({id:m.id,episode_id:e.id,author:UID,kind:m.kind,character_id:m.cid||null,display_name:m.name,avatar_path:im?pthI(im):null,body:m.text,parent:m.parent||null}));S.m[id]=1}
 for(const id of Object.keys(S.m))if(!cur[id]){await ok(sb.from('comments').delete().eq('id',id));delete S.m[id]}
 // 5) 임시 저장
 for(const d of db.drafts){const r=rowD(d),j=J(r);if(S.d[d.id]!==j){await put('drafts',Object.assign(r,{updated_at:new Date(d.ts||Date.now()).toISOString()}),S.d[d.id]===undefined);S.d[d.id]=j}}
 for(const id of Object.keys(S.d))if(!db.drafts.find(d=>d.id===id)){await ok(sb.from('drafts').delete().eq('id',id));delete S.d[id]}
 // 6) 보기 설정
 const uj=J(rowU());if(S.u!==uj){await ok(sb.from('user_settings').upsert(rowU()));S.u=uj}
 // 7) 구독

}
