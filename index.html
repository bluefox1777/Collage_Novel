 const R=await Promise.all([q('profiles'),sb.from('series').select('*').order('created_at',{ascending:false}),sb.from('episodes').select('*').order('position'),q('characters'),q('tracks'),sb.from('comments').select('*').order('created_at'),sb.from('subscriptions').select('series_id').eq('user_id',UID),sb.from('drafts').select('*').eq('owner',UID).order('updated_at',{ascending:false}),sb.from('user_settings').select('*').eq('user_id',UID).maybeSingle()]);
 R.forEach(r=>{if(r.error)throw r.error});
 const [pr,se,ep,ch,tr,cm,sub,dr,us]=R.map(r=>r.data);
 PN={};pr.forEach(p=>{PN[nid(p.id)]=p.nickname;if(nid(p.id)===ME)isAdm=!!p.is_admin});
 const D=emptyDb(),u=us||{},rd=u.reader||{};
 D.set={alias:u.alias_on!==false,bgm:u.bgm_on!==false,noRp:!!u.hide_rp,block:u.block_warns||[]};
 D.prefs={size:rd.size||18,lh:rd.lh||1.9,th:rd.th||'white',font:rd.font||undefined,vol:u.volume==null?70:u.volume,alias:u.aliases||{}};
 D.colors=rd.colors||[];
 D.subs=sub.map(x=>nid(x.series_id));
 D.chars=ch.map(c=>({id:nid(c.id),owner:nid(c.owner),name:c.name,link:c.wiki_link||'',img:urlI(c.avatar_path)}));
 D.tracks=tr.map(t=>({id:nid(t.id),owner:nid(t.owner),name:t.name,path:t.path,src:urlA(t.path)}));
 const cmBy={};cm.forEach(c=>{const k=nid(c.episode_id);(cmBy[k]=cmBy[k]||[]).push({id:nid(c.id),kind:c.kind,name:c.display_name,img:urlI(c.avatar_path),text:c.body,d:c.created_at.slice(0,10),mine:nid(c.author)===ME?1:0,cid:c.character_id?nid(c.character_id):null})});
 const epBy={};ep.forEach(e=>{const k=nid(e.series_id);(epBy[k]=epBy[k]||[]).push({id:nid(e.id),title:e.title,st:e.status,d:e.created_at.slice(0,10),html:e.html,img:urlI(e.thumb_path),cast:(e.cast_ids||[]).map(nid),bgm:nid(e.bgm)||'',sc:e.scenes||{},cm:cmBy[nid(e.id)]||[]})});
 D.series=se.map(s=>({id:nid(s.id),title:s.title,author:nid(s.owner),kind:s.kind,status:s.status,desc:s.description,tags:s.tags||[],warns:s.warns||[],cover:urlI(s.cover_path),theme:s.theme_track?nid(s.theme_track):'',eps:epBy[nid(s.id)]||[]}));
 D.drafts=dr.map(d=>({id:nid(d.id),sid:d.target,title:d.title,html:d.html,cast:(d.cast_ids||[]).map(nid),img:d.thumb_path||'',bgm:nid(d.bgm)||'',sc:d.scenes||{},ts:Date.parse(d.updated_at)}));
 db=D;snap=mkSnap();lastLoad=Date.now()}

// ----- 서버로 저장하기 -----
const ok=async p=>{const r=await p;if(r.error)throw r.error;return r};
const put=async(t,row,isNew)=>{if(isNew)await ok(sb.from(t).insert(row));else await ok(sb.from(t).update(row).eq('id',row.id))};
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','audio/mpeg':'mp3','audio/mp3':'mp3','audio/wav':'wav','audio/x-wav':'wav','audio/ogg':'ogg','audio/mp4':'m4a','audio/aac':'aac','audio/webm':'webm'};
const d2b=async u=>(await fetch(u)).blob();
async function upImg(u){const b=await d2b(u),p=UID+'/'+rid()+'.'+(EXT[b.type]||'jpg');await ok(sb.storage.from('images').upload(p,b,{contentType:b.type||'image/jpeg'}));return PUB+'images/'+p}
async function upHtml(h){const L=[...new Set([...h.matchAll(/src="(data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+)"/g)].map(m=>m[1]))];for(const u of L){const n=await upImg(u);h=h.split(u).join(n)}return h}

async function doSync(){
 if(!ME||!snap)return;const S=snap;
 // 1) 음원
 const mt=db.tracks.filter(t=>t.owner===ME);
 for(const t of mt){if(S.t[t.id]!==undefined)continue;let p;
  if(t.src.startsWith('data:')){const b=await d2b(t.src);p=UID+'/'+t.id+'.'+(EXT[b.type]||'mp3');await ok(sb.storage.from('audio').upload(p,b,{contentType:b.type||'audio/mpeg'}));t.src=PUB+'audio/'+p;await ok(sb.from('tracks').insert({id:t.id,owner:UID,name:t.name,path:p,size_bytes:b.size}))}
  else p=pthA(t.src);
  t.path=p;S.t[t.id]=p}
 // 2) 캐릭터
 const mc=db.chars.filter(c=>c.owner===ME);
 for(const c of mc){if(c.img&&c.img.startsWith('data:'))c.img=await upImg(c.img);const r=rowC(c),j=J(r);if(S.c[c.id]!==j){await put('characters',r,S.c[c.id]===undefined);S.c[c.id]=j}}
 // 3) 시리즈와 회차
 const ms=mineS();
 for(const s of ms){
  if(s.cover&&s.cover.startsWith('data:'))s.cover=await upImg(s.cover);
  const r=rowS(s),j=J(r);if(S.s[s.id]!==j){await put('series',r,S.s[s.id]===undefined);S.s[s.id]=j}
  for(let i=0;i<s.eps.length;i++){const e=s.eps[i];
   if(e.img&&e.img.startsWith('data:'))e.img=await upImg(e.img);
   if(e.html&&e.html.includes('src="data:image'))e.html=await upHtml(e.html);
   const x=rowE(e,i,s.id),ej=J(x);
   if(S.e[e.id]!==ej){x.updated_at=new Date().toISOString();await put('episodes',x,S.e[e.id]===undefined);S.e[e.id]=ej}}}
 const sids=new Set(ms.map(s=>s.id)),eids=new Set();ms.forEach(s=>s.eps.forEach(e=>eids.add(e.id)));
 for(const id of Object.keys(S.e))if(!eids.has(id)){await ok(sb.from('episodes').delete().eq('id',id));delete S.e[id]}
 for(const id of Object.keys(S.s))if(!sids.has(id)){await ok(sb.from('series').delete().eq('id',id));delete S.s[id]}
 for(const id of Object.keys(S.c))if(!mc.find(c=>c.id===id)){await ok(sb.from('characters').delete().eq('id',id));delete S.c[id]}
 for(const id of Object.keys(S.t))if(!mt.find(t=>t.id===id)){await ok(sb.from('tracks').delete().eq('id',id));await sb.storage.from('audio').remove([S.t[id]]);delete S.t[id]}
 // 4) 댓글
 const cur={};db.series.forEach(s=>s.eps.forEach(e=>(e.cm||[]).forEach(m=>{if(m.mine)cur[m.id]=[e,m]})));
 for(const id of Object.keys(cur)){if(S.m[id])continue;const [e,m]=cur[id];let im=m.img;if(im&&im.startsWith('data:'))im=await upImg(im);
  await ok(sb.from('comments').insert({id:m.id,episode_id:e.id,author:UID,kind:m.kind,character_id:m.cid||null,display_name:m.name,avatar_path:im?pthI(im):null,body:m.text}));S.m[id]=1}
 for(const id of Object.keys(S.m))if(!cur[id]){await ok(sb.from('comments').delete().eq('id',id));delete S.m[id]}
 // 5) 임시 저장
 for(const d of db.drafts){const r=rowD(d),j=J(r);if(S.d[d.id]!==j){await put('drafts',Object.assign(r,{updated_at:new Date(d.ts||Date.now()).toISOString()}),S.d[d.id]===undefined);S.d[d.id]=j}}
 for(const id of Object.keys(S.d))if(!db.drafts.find(d=>d.id===id)){await ok(sb.from('drafts').delete().eq('id',id));delete S.d[id]}
 // 6) 보기 설정
 const uj=J(rowU());if(S.u!==uj){await ok(sb.from('user_settings').upsert(rowU()));S.u=uj}
 // 7) 구독
 for(const id of db.subs)if(!S.sub.includes(id)){await ok(sb.from('subscriptions').insert({user_id:UID,series_id:id}));S.sub.push(id)}
 for(const id of S.sub.slice())if(!db.subs.includes(id)){await ok(sb.from('subscriptions').delete().match({user_id:UID,series_id:id}));S.sub.splice(S.sub.indexOf(id),1)}
}

if(c.tagName==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:\/\/|mailto:)/i.test(h)){c.replaceWith(...c.childNodes);return}[...c.attributes].forEach(t=>c.removeAttribute(t.name));c.setAttribute('href',h);c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer');return}
if(!OK[c.tagName]){c.replaceWith(...c.childNodes);return}
const st=c.getAttribute('style')||'',a=/text-align:\s*(left|center|right|justify)/.exec(st),k=/(?:^|;)\s*color:\s*(#[0-9a-fA-F]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))/.exec(st),f=/font-family:\s*["']?([^;"',]+)/.exec(st),q=/^q[1-6]$/.exec(c.getAttribute('class')||''),nt=c.tagName==='SPAN'&&/^[a-z0-9]+$/.test(c.getAttribute('data-c')||'')&&/^(full|first|last)$/.test(c.getAttribute('data-k')||'')?[c.getAttribute('data-c'),c.getAttribute('data-k')]:null;

function bgUI(){const c=$('#bgc');if(!c)return;if(db.set.bgm===false||!bgCtx||!bgHas(bgCtx.s,bgCtx.e)){c.innerHTML='';return}const t=bgCur&&db.tracks.find(x=>x.id===bgCur),v=db.prefs.vol==null?70:db.prefs.vol;c.innerHTML=rb(bgOn?'BGM 일시정지':'BGM 재생',`bgPlay()`,SV(bgOn?ICO.pause:ICO.play),bgOn?'on':'')+`<span class="vl" title="BGM 음량">${SV(ICO.vol)}<input type="range" min="0" max="100" value="${v}" oninput="bgV(this.value)" onchange="bgSv()" aria-label="BGM 음량"></span>`+(t?`<span class="mu bgn">${esc(t.name)}</span>`:'')}
function bgPlay(){if(!bgCur){bgOn=!bgOn;bgUI();return}if(bgOn){bgOn=false;au.pause()}else{bgOn=true;au.volume=tvol();au.play().catch(()=>{bgOn=false;bgUI();toast('재생하지 못했어요. 음원 파일을 확인해 주세요')})}bgUI()}
function bgV(v){db.prefs.vol=+v;au.volume=tvol()}
function bgSv(){save()}
addEventListener('scroll',()=>{if(bgCtx)bgScroll()},{passive:true});
function vMusic(){const my=mytr();app.innerHTML=`<div class="wrap"><h1>내 음원</h1><p class="mu">작품에 쓸 BGM을 여기에 올려 두고, 시리즈 테마곡이나 회차·장면 BGM으로 골라 쓰세요. 음원 1개당 ${MAXA}MB까지 올릴 수 있어요.</p><div class="box" style="margin-top:16px"><label>음원 파일<input type="file" id="af" accept="audio/*"></label><label>곡 이름 <span class="mu">비우면 파일 이름을 써요</span><input id="an" maxlength="40"></label><div class="acts"><button class="btn" onclick="aup()">음원 올리기</button></div></div><div>${my.map(t=>`<div class="row" style="align-items:center"><div style="flex:1;min-width:0"><h3 style="font-size:16px">${esc(t.name)}</h3>${AUD.test(t.src)?`<audio controls preload="none" src="${t.src}" style="width:100%;margin-top:6px"></audio>`:''}</div><button class="btn ghost" onclick="adl('${t.id}')">삭제</button></div>`).join('')||'<p class="mu" style="margin:20px 0">아직 올린 음원이 없습니다.</p>'}</div></div>`}
function aup(){const f=$('#af').files[0];if(!f){toast('음원 파일을 골라 주세요');return}if(!/^audio\//.test(f.type)){toast('오디오 파일만 올릴 수 있어요');return}if(f.size>MAXA*1048576){toast('파일이 너무 커요. '+MAXA+'MB 이하로 줄여 주세요');return}const r=new FileReader();r.onload=()=>{if(!AUD.test(r.result)){toast('이 형식은 사용할 수 없어요');return}const t={id:uid('t'),owner:ME,name:($('#an').value.trim()||f.name.replace(/\.[^.]+$/,'')).slice(0,40),src:r.result};db.tracks.push(t);if(save()){toast('음원을 올렸습니다');vMusic()}else db.tracks.pop()};r.onerror=()=>toast('파일을 읽을 수 없어요');r.readAsDataURL(f)}
function adl(id){db.tracks=db.tracks.filter(t=>t.id!==id);db.series.forEach(s=>{if(s.theme===id)s.theme='';s.eps.forEach(e=>{if(e.bgm===id)e.bgm='';if(e.sc)Object.keys(e.sc).forEach(k=>{if(e.sc[k]===id)delete e.sc[k]})})});save();vMusic()}
function route(){if(!ME){vAuth();return}const p=(location.hash.slice(1)||'home').split('-');if(p[0]!=='read')bgStop();
const m={series:()=>vSeries(p[1]),read:()=>vRead(p[1],p[2]),write:()=>vWrite(p[1],p[2]),edit:()=>vEdit(p[1]),chars:()=>{ceid=null;avData='';vChars()},char:()=>vChar(p[1]),cast:()=>vCast(p[1],p[2]),settings:vSet,music:vMusic,mine:vMine};
(Object.prototype.hasOwnProperty.call(m,p[0])?m[p[0]]:vHome)();window.scrollTo(0,0);if(p[0]==='home'||p[0]==='series')stale()}
addEventListener('hashchange',route);
boot();
</script>
